<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Agente de triaje de incidencias{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; background: #fafafa; }
    h1 { font-size: 1.4rem; }
    nav a { margin-right: 16px; color: #2563eb; text-decoration: none; font-size: 0.9rem; }
    label { display: block; margin-top: 14px; font-weight: 600; font-size: 0.9rem; }
    input, textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; box-sizing: border-box; }
    textarea { min-height: 120px; }
    button { margin-top: 18px; padding: 10px 18px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    button.rechazar { background: #dc2626; }
    .card { background: white; border: 1px solid #e5e5e5; border-radius: 10px; padding: 18px; margin-top: 16px; }
    .estado { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
    .estado.auto_resuelto { background: #dcfce7; color: #166534; }
    .estado.pendiente_revision { background: #fef9c3; color: #854d0e; }
    .estado.aprobado { background: #dbeafe; color: #1e40af; }
    .estado.rechazado { background: #fee2e2; color: #991b1b; }
    pre { white-space: pre-wrap; font-family: inherit; background: #f5f5f5; padding: 10px; border-radius: 6px; }
    dt { font-weight: 600; font-size: 0.85rem; color: #555; margin-top: 8px; }
    dd { margin: 2px 0 0 0; }
  </style>
</head>
<body>
  <nav><a href="/">Enviar incidencia</a><a href="/revision">Bandeja de revisión</a></nav>
  {% block contenido %}{% endblock %}
</body>
</html>
